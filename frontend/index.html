<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        let saved = null;
        try {
          saved = window.localStorage.getItem("swissdial-theme");
        } catch {}
        const explicit = ["dark", "light"].includes(param) ? param : saved;
        const theme = explicit || "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="/minimal.css?v=17" />
    <title>Swiss German Speech Lab</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="app">Loading Swiss German transcription benchmark...</div>
    <script src="/minimal-app.js?v=24" defer></script>
  </body>
</html>
