name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
    env:
      PYTHON_DOTENV_DISABLED: "1"
      BENCHMARK_TRACE_ENABLED: "false"
      BENCHMARK_TRACE_SENSITIVE_DATA: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check publishable files and screenshot references
        run: python scripts/check_publication.py
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q backend scripts
      - name: Run offline backend tests
        run: python -m unittest discover -s backend/tests -v
      - name: Check browser JavaScript syntax
        working-directory: frontend
        run: node --check minimal-app.js
      - name: Run frontend regressions
        run: node --test
